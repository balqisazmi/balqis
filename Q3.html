<!DOCTYPE html>
<html>
<head>
  	<title>jQuery DOM Operations</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>  
<style>
    	.myStyle {
      background-color: coral;
      padding: 16px;
    	}
  	</style>
</head>
<body>
  <div id="myElement">Original Text</div>

  <div id="myDIV">
    <p>I am a myDIV.</p>
  </div>

  <button id="myButton">Click me</button>
  <script>
    $(document).ready(function() {
        // a
        // var element = document.getElementById("myElement");
        // element.textContent = "Modified Text";
        // jQuery uses text() to set or get the text content of an element.
        $("#myElement").text("Modified Text");

        // b
        // var paragraph = document.querySelector("#myDIV");
        // paragraph.classList.add("myStyle");
        // The addClass() method adds the specified class to the selected element.
        $("#myDIV").addClass("myStyle");

        // c
        // var button = document.getElementById("myButton");
        // button.addEventListener("click", function() {
        //   alert("Button clicked!");
        // The click() method binds a click event handler to the selected element.
        $("#myButton").click(function() {
          alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
