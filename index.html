<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - JSON and jQuery</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <h1>Book Details</h1>

  <script>
    $(document).ready(function() {
      // JSON data from Question 1
      const data = {
        "Books": [
          {
            "title": "The Great Gatsby",
            "author": "F. Scott Fitzgerald",
            "publicationYear": 1925,
            "genres": ["Fiction", "Classics"]
          },
          {
            "title": "To Kill a Mockingbird",
            "author": "Harper Lee",
            "publicationYear": 1960,
            "genres": ["Fiction", "Coming-of-Age"]
          }
        ]
      };

      // Extract required details
      const title1 = data.Books[0].title;
      const author2 = data.Books[1].author;
      const genres = data.Books.map(book => book.genres.join(", ")).join("; ");

      // Display details in the browser console
      console.log("Title of the first book:", title1);
      console.log("Author of the second book:", author2);
      console.log("Genres of all books:", genres);

    });
  </script>
</body>
</html>
